# Releases pierd when a tag pierd-v<version> is pushed: the tests, binaries for Linux and macOS (x64, arm64) on a
# GitHub Release with their checksums (what the install script and the Homebrew formula download), then the npm
# packages (pierd and pierd-<os>-<cpu>) when the NPM_TOKEN secret is set.
name: pierd release

on:
  push:
    tags: ["pierd-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: Server/pierd/go.mod

      - name: Test
        working-directory: Server/pierd
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tmux
          go vet ./...
          go test ./...

      - name: Build
        run: |
          set -eu
          version=${GITHUB_REF_NAME#pierd-v}
          mkdir -p dist build
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*} arch=${target#*/}
            name=pierd-v$version-$os-$arch
            mkdir -p "build/$name"
            (cd Server/pierd && GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X pier/pierd/internal/version.Version=v$version" -o "../../build/$name/pierd" ./cmd/pierd)
            cp LICENSE "build/$name/"
            tar -C build -czf "dist/$name.tar.gz" "$name"
          done
          (cd dist && sha256sum ./*.tar.gz | sed 's| \./| |' > checksums.txt)
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          pierd v$VERSION for Linux and macOS (x64, arm64).

          Install and pair, on a server over SSH or on your Mac:

          \`\`\`sh
          curl -fsSL https://wagnerfnds.github.io/pier/install.sh | sh
          \`\`\`

          or \`npm install -g pierd && pierd setup\`, or \`brew install wagnerfnds/tap/pierd && pierd setup\`.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --title "pierd v$VERSION" --notes-file notes.md

      - uses: actions/setup-node@v4
        if: env.NPM_TOKEN != ''
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: npm
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          Server/pierd/npm/build.sh "$VERSION" dist npm-out
          Server/pierd/npm/publish.sh npm-out
